<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Orbit — a daily design reference</title>
  <meta name="description" content="One piece of design inspiration a day, stitched into a net around the globe." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%236ff3ff%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%232a6bff%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/OrbitControls.js": "./vendor/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="masthead">
    <h1>Design Orbit</h1>
    <p class="count"><span id="filled">0</span> panels lit</p>
    <p class="edit-badge" id="edit-badge" hidden>Edit mode</p>
  </header>

  <div id="tooltip" class="tooltip" hidden></div>

  <button id="cal-toggle" class="cal-toggle" type="button" aria-expanded="false" aria-controls="calendar">
    <span class="cal-flame" id="cal-streak">0</span> day streak · Calendar
  </button>

  <section id="calendar" class="calendar" aria-label="Progress calendar" hidden>
    <header class="cal-head">
      <button type="button" class="cal-nav" id="cal-prev" aria-label="Previous month">‹</button>
      <h2 id="cal-title"></h2>
      <button type="button" class="cal-nav" id="cal-next" aria-label="Next month">›</button>
      <button type="button" class="cal-close" id="cal-close" aria-label="Close calendar">×</button>
    </header>
    <dl class="cal-stats">
      <div><dt>Current streak</dt><dd id="st-streak">0</dd></div>
      <div><dt>Best streak</dt><dd id="st-best">0</dd></div>
      <div><dt>Days done</dt><dd id="st-done">0</dd></div>
      <div><dt>Entries</dt><dd id="st-total">0</dd></div>
    </dl>
    <div class="cal-grid" id="cal-grid" role="grid"></div>
    <ul class="cal-legend">
      <li><i class="lg done"></i>Done</li>
      <li><i class="lg multi"></i>2+ entries</li>
      <li><i class="lg missed"></i>Missed</li>
      <li><i class="lg today"></i>Today</li>
    </ul>
    <div class="cal-day" id="cal-day"></div>
  </section>

  <div id="scrim" class="scrim"></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" aria-hidden="true">
    <button class="close" id="close" aria-label="Close">×</button>
    <figure>
      <img id="p-image" alt="" />
    </figure>
    <div class="meta">
      <p class="day" id="p-day"></p>
      <h2 id="p-title"></h2>
      <p class="note" id="p-note"></p>
      <section class="kw" aria-label="Keywords">
        <h3>Keywords</h3>
        <ul class="kw-chips" id="kw-chips"></ul>
        <div class="kw-search" id="kw-search">
          <input id="kw-input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search keywords…" role="combobox" aria-expanded="false"
                 aria-controls="kw-list" aria-autocomplete="list" />
          <ul class="kw-list" id="kw-list" role="listbox" hidden></ul>
        </div>
      </section>
      <a id="p-link" class="link" target="_blank" rel="noopener">View source ↗</a>
    </div>
    <nav class="stepper">
      <button id="prev" aria-label="Previous day">← Prev</button>
      <button id="next" aria-label="Next day">Next →</button>
    </nav>
  </aside>

  <div class="savebar" id="savebar" hidden>
    <span id="save-status">Unsaved keyword changes</span>
    <button id="save-download" type="button">Download JSON</button>
    <button id="save-github" type="button" class="primary">Save to GitHub</button>
  </div>

  <p class="hint">Drag to orbit · Scroll to zoom · Click a lit panel</p>

  <script type="module" src="main.js"></script>
  <script type="module" src="keywords.js"></script>
  <script type="module" src="calendar.js"></script>
</body>
</html>
